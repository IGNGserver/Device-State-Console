<!doctype html>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; }
  iframe { display: block; border: 0; }
</style>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const narrow = params.get("narrow") === "1";
  const width = params.get("width") || (narrow ? "500" : "1440");
  const height = params.get("height") || (narrow ? "844" : "900");
  const theme = params.get("theme") || "light";
  const density = params.get("density") || "compact";
  const page = params.get("page") || "overview";

  document.documentElement.style.width = `${width}px`;
  document.documentElement.style.height = `${height}px`;
  document.body.style.width = `${width}px`;
  document.body.style.height = `${height}px`;
  localStorage.setItem("guanlan-theme", theme);
  localStorage.setItem("guanlan-contrast", "normal");
  localStorage.setItem("guanlan-motion", "reduced");
  localStorage.setItem("guanlan-interaction-scale", density);
  localStorage.setItem("dsc_mock_preview", "true");

  const frame = document.createElement("iframe");
  frame.style.width = narrow ? "390px" : `${width}px`;
  frame.style.height = `${height}px`;
  document.body.appendChild(frame);
  frame.src = "file:///C:/项目/设备状态控制台/artifacts/releases/v0.2.79/portable-v0.2.79/app-extracted/dist/renderer/index.html?mock=1";

  function exactButton(doc, label) {
    return [...doc.querySelectorAll("button")].find((button) => button.textContent.trim() === label);
  }

  function routePage() {
    const doc = frame.contentDocument;
    if (!doc || !doc.body) return;

    if (page === "overview") return;
    if (page === "devices" || page === "device-detail") {
      const devices = exactButton(doc, "设备");
      if (devices) devices.click();
      if (page === "device-detail") {
        const detail = doc.querySelector('button[aria-label^="查看设备"]');
        if (detail) detail.click();
      }
      return;
    }

    let target = exactButton(doc, page === "settings" ? "设置" : "诊断");
    if (!target) {
      const more = exactButton(doc, "更多");
      if (more) {
        more.click();
        target = exactButton(doc, page === "settings" ? "设置" : "诊断");
      }
    }
    if (target) target.click();
  }

  frame.addEventListener("load", () => setTimeout(routePage, 500));
  setInterval(routePage, 500);
</script>
</body>
